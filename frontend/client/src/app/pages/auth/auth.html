<div class="auth-container">
  <div class="auth-card">
    
    <div *ngIf="isLoginView; else registerView">
      <h2 class="auth-title">Iniciar Sesión</h2>
      <p class="auth-subtitle">Bienvenido de nuevo</p>
      
      <form [formGroup]="loginForm" (ngSubmit)="onLoginSubmit()">
        <div class="form-group">
          <label for="login-email">Correo Electrónico</label>
          <input id="login-email" type="email" class="form-control" formControlName="correo">
        </div>
        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input id="login-password" type="password" class="form-control" formControlName="password">
        </div>
        <button type="submit" class="btn-auth" [disabled]="loginForm.invalid">Ingresar</button>
      </form>
      
      <p class="toggle-text">
        ¿No tienes una cuenta? <a (click)="toggleView()">Regístrate aquí</a>
      </p>
    </div>

    <ng-template #registerView>
      <h2 class="auth-title">Crear Cuenta</h2>
      <p class="auth-subtitle">Únete a nosotros</p>
      
      <form [formGroup]="registerForm" (ngSubmit)="onRegisterSubmit()">
        <div class="form-group">
          <label for="reg-nombre">Nombre Completo</label>
          <input id="reg-nombre" type="text" class="form-control" formControlName="nombre">
        </div>
        <div class="form-group">
          <label for="reg-email">Correo Electrónico</label>
          <input id="reg-email" type="email" class="form-control" formControlName="correo">
        </div>
        <div class="form-group">
          <label for="reg-password">Contraseña</label>
          <input id="reg-password" type="password" class="form-control" formControlName="password">
        </div>
        <div class="form-group">
          <label for="reg-empresa">ID de la Empresa</label>
          <input id="reg-empresa" type="text" class="form-control" formControlName="id_empresa">
        </div>
        
        <button type="submit" class="btn-auth" [disabled]="registerForm.invalid">Registrarse</button>
      </form>

      <p class="toggle-text">
        ¿Ya tienes una cuenta? <a (click)="toggleView()">Inicia sesión</a>
      </p>
    </ng-template>

    <div class="back-home">
      <a routerLink="/"><i class="fas fa-arrow-left me-2"></i>Volver al Inicio</a>
    </div>

  </div>
</div>
