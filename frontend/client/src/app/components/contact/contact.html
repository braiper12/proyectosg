<section id="contact" class="contact-section">
  <div class="container">
    <h2 class="section-title">Contacto</h2>
    <div class="row">

      <div class="col-lg-7">
        <div class="contact-form">
          <h3 class="mb-4">Envíanos un Mensaje</h3>
          
          <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
            <div class="row">
              <div class="col-md-6 mb-3">
                <input type="text" class="form-control" formControlName="name" placeholder="Nombre completo">
              </div>
              <div class="col-md-6 mb-3">
                <input type="email" class="form-control" formControlName="email" placeholder="Correo electrónico">
              </div>
            </div>
            <textarea class="form-control mb-3" formControlName="message" rows="5" placeholder="Mensaje"></textarea>

            <button type="submit" class="btn btn-primary-custom w-100" [disabled]="contactForm.invalid">
              <i class="fas fa-paper-plane me-2"></i>Enviar Mensaje
            </button>
          </form>

          <div *ngIf="formSubmitted && contactForm.valid" class="alert alert-success mt-3">
            <i class="fas fa-check-circle me-2"></i>¡Mensaje enviado! Nos pondremos en contacto pronto.
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="contact-info">
          <h3 class="mb-4">Información de Contacto</h3>
          <div class="contact-item"><i class="fas fa-map-marker-alt"></i><p [innerHTML]="contactInfo.address"></p></div>
          <div class="contact-item"><i class="fas fa-phone"></i><p>{{contactInfo.phone1}}<br>{{contactInfo.phone2}}</p></div>
          <div class="contact-item"><i class="fas fa-envelope"></i><p>{{contactInfo.email}}</p></div>
          <div class="contact-item"><i class="fas fa-clock"></i><p [innerHTML]="contactInfo.schedule"></p></div>
          
          <div class="social-links">
            <h5>Síguenos</h5>
            <a *ngFor="let link of socialLinks" [href]="link.url" [class]="link.colorClass" target="_blank">
              <i [class]="link.icon"></i>
            </a>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
